name: Aplicar migrações no Supabase

# Roda a cada envio para o main que altere as migrações,
# ou manualmente pela aba Actions ("Run workflow").
on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  migrar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: gdsomvrokbuslagtxuid
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Conectar ao projeto
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Aplicar migrações pendentes
        run: supabase db push --remote
