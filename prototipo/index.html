<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Risco360 — PGR, PCMSO e LTCAT</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1d2b36;background:#f2f5f7;font-size:14px}
#app{display:flex;min-height:100vh}
#side{width:260px;flex-shrink:0;background:#0f3d3e;color:#e6f2f1;display:flex;flex-direction:column;padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-size:23px;padding:4px 8px 16px;font-weight:300}.brand b{color:#5fd3b3;font-weight:700}.brand small{display:block;font-size:11px;opacity:.7;letter-spacing:.6px;margin-top:2px}
.side-btn{display:block;width:100%;text-align:left;background:transparent;border:none;color:#e6f2f1;padding:8px 10px;border-radius:7px;margin-bottom:2px}
.side-btn:hover{background:#ffffff14}.side-btn.act{background:#127369}
.side-h{display:flex;justify-content:space-between;align-items:center;font-size:11px;text-transform:uppercase;letter-spacing:.6px;opacity:.8;margin:18px 8px 8px}
.side-h .mini{background:#5fd3b3;color:#0f3d3e;border:none;padding:3px 9px;font-weight:700;font-size:11px}
.side-search{background:#ffffff12;border:1px solid #ffffff22;color:#fff;margin-bottom:8px}
.side-search::placeholder{color:#ffffff88}
.side-emp small{display:block;font-size:11px;opacity:.65}
.side-foot{margin-top:auto;display:flex;gap:6px;padding-top:12px;flex-wrap:wrap}
.side-foot button,.side-foot label{flex:1;background:#ffffff12;color:#e6f2f1;border:1px solid #ffffff22;font-size:12px;padding:6px;border-radius:7px;text-align:center;cursor:pointer;flex-direction:row;justify-content:center;font-weight:400}
main{flex:1;padding:24px 32px;min-width:0}
h1.pg{margin:0 0 4px;font-size:22px}.sub{color:#607d8b;margin:0 0 18px}
.card{background:#fff;border-radius:10px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:16px;overflow-x:auto}
.card h3{margin:0 0 12px;font-size:15px}
button{font:inherit;cursor:pointer;border:1px solid #cfd8dc;background:#fff;border-radius:7px;padding:7px 12px;color:#1d2b36}
button:hover{border-color:#90a4ae}
button.pri{background:#127369;color:#fff;border-color:#127369}button.pri:hover{background:#0e5f57}
button.del{border:none;background:transparent;color:#b0bec5;padding:4px 8px}button.del:hover{color:#c62828}
button.link{border:none;background:none;color:#127369;padding:2px 4px;text-decoration:underline}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid #cfd8dc;border-radius:6px;width:100%;background:#fff;color:#1d2b36}
textarea{min-height:60px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #5fd3b3;border-color:#5fd3b3}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#546e7a;font-weight:600}
.fg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.span2{grid-column:span 2}.span3{grid-column:span 3}.span4{grid-column:1/-1}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}.grow{flex:1;min-width:0}
.muted{color:#78909c}
.tabs{display:flex;gap:4px;border-bottom:2px solid #dfe5e8;margin-bottom:18px;flex-wrap:wrap}
.tabs button{border:none;background:none;border-radius:7px 7px 0 0;padding:10px 16px;color:#546e7a;font-weight:600;margin-bottom:-2px;border-bottom:2px solid transparent}
.tabs button.act{color:#127369;border-bottom-color:#127369}
table.t{width:100%;border-collapse:collapse}
.t th{font-size:11px;text-transform:uppercase;color:#78909c;letter-spacing:.4px;font-weight:600}
.t th,.t td{padding:8px;border-bottom:1px solid #eceff1;text-align:left;vertical-align:top}
.t tr:hover td{background:#fafcfc}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;color:#fff;font-size:11px;font-weight:600;white-space:nowrap;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.nv-baixo{background:#43a047}.nv-moderado{background:#f9a825}.nv-alto{background:#ef6c00}.nv-critico{background:#c62828}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}.stat b{display:block;font-size:26px;color:#127369}.stat span{color:#78909c;font-size:12px}
.ghe-wrap{display:flex;gap:16px;align-items:flex-start}
.ghe-list{width:240px;flex-shrink:0;padding:10px}
.ghe-item{display:block;width:100%;text-align:left;border:none;padding:9px 10px;margin-bottom:4px;border-radius:7px}
.ghe-item small{display:block;color:#78909c;font-size:11px}.ghe-item.act{background:#e0f2ef}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;flex-direction:row;align-items:center;gap:6px;border:1px solid #cfd8dc;border-radius:16px;padding:4px 10px;font-weight:500;color:#37474f;cursor:pointer}
.chip input{width:auto;margin:0}.chip.on{background:#e0f2ef;border-color:#5fd3b3}
.matriz{display:inline-grid;grid-template-columns:70px repeat(5,38px);gap:2px;font-size:10px;text-align:center}
.matriz div{padding:6px 0;border-radius:3px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.matriz .c{color:#fff;font-weight:700;font-size:12px}
.matriz .lbl{color:#607d8b;text-align:right;padding-right:6px}
.alerta{background:#fff8e1;border-left:4px solid #f9a825;padding:8px 12px;border-radius:4px;margin:6px 0;font-size:13px}
.ok{background:#e8f5e9;border-left:4px solid #43a047;padding:8px 12px;border-radius:4px;margin:6px 0;font-size:13px}
.docs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.doccard h3{font-size:18px;margin-bottom:4px}.doccard p{color:#607d8b;margin:0 0 12px;font-size:13px}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;padding:8px 0 8px 38px;position:relative}
.steps li::before{content:counter(s);position:absolute;left:0;top:6px;width:26px;height:26px;border-radius:50%;background:#e0f2ef;color:#127369;font-weight:700;display:flex;align-items:center;justify-content:center}
dialog{border:none;border-radius:12px;padding:0;width:min(920px,95vw);box-shadow:0 10px 40px rgba(0,0,0,.3);max-height:92vh}
dialog::backdrop{background:#0f3d3e88}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid #eceff1;font-weight:700;font-size:16px}
.dlg-h button{border:none}
.dlg-b{padding:18px 20px;overflow:auto;max-height:calc(92vh - 130px)}
.dlg-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid #eceff1}
.sep{grid-column:1/-1;font-size:12px;font-weight:700;color:#127369;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #e0f2ef;padding-bottom:4px;margin-top:6px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#263238;color:#fff;padding:10px 18px;border-radius:8px;opacity:0;transition:.3s;pointer-events:none;z-index:99}
#toast.show{opacity:1}
/* Documento */
#doc{display:none;position:fixed;inset:0;background:#525659;overflow:auto;z-index:50}
#doc.show{display:block}
.doc-bar{position:sticky;top:0;background:#263238;color:#fff;padding:10px 20px;display:flex;gap:10px;align-items:center;z-index:2}
.doc-bar .grow{font-weight:600}
.paper{background:#fff;width:210mm;margin:20px auto;padding:20mm 18mm;font-family:Arial,Helvetica,sans-serif;font-size:10.5pt;line-height:1.45;color:#000}
.paper h1{font-size:20pt}.paper h2.sec{font-size:13pt;background:#0f3d3e;color:#fff;padding:5px 10px;margin:22px 0 10px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.paper h3{font-size:11pt;margin:16px 0 6px;border-bottom:1px solid #999;padding-bottom:2px}
.paper table{width:100%;border-collapse:collapse;margin:6px 0 12px;font-size:9pt}
.paper th,.paper td{border:1px solid #888;padding:4px 6px;text-align:left;vertical-align:top}
.paper th{background:#e0ece9;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.paper .kv th{width:32%}
.capa{height:250mm;display:flex;flex-direction:column;justify-content:center;text-align:center;border:3px double #0f3d3e;padding:20mm}
.capa .top{font-size:12pt;letter-spacing:1px;color:#127369;font-weight:700;margin-bottom:40mm}
.capa h1{margin:0;color:#0f3d3e;font-size:30pt}.capa h2{font-weight:400;margin:6px 0 40mm;font-size:13pt}
.capa .emp{font-size:13pt}.capa .dt{margin-top:30mm;color:#444}
.assin{margin:40px auto 0;width:60%;text-align:center;border-top:1px solid #000;padding-top:6px}
.nota{font-size:8.5pt;color:#555;font-style:italic}
@media print{
  body{background:#fff}
  #app,.doc-bar,dialog,#toast{display:none!important}
  #doc{position:static;display:block!important;background:#fff;overflow:visible}
  .paper{margin:0;padding:0;width:auto;box-shadow:none}
  .capa{page-break-after:always;height:255mm}
  h2.sec,h3{page-break-after:avoid}tr{page-break-inside:avoid}
  @page{size:A4;margin:16mm 14mm}
}
@media (max-width:900px){#side{width:200px}.fg,.docs,.stats{grid-template-columns:1fr 1fr}.ghe-wrap{flex-direction:column}.ghe-list{width:100%}main{padding:16px}}
</style>
</head>

function aplicarModelo(e,key){
  const m=MODELOS[key];if(!m)return;
  e.grau=e.grau||m.grau;e.atividade=e.atividade||m.atividade;
  const setId={};m.setores.forEach(([nome,descricao])=>{const s={id:uid(),nome,descricao};e.setores.push(s);setId[nome]=s.id});
  const carId={};m.cargos.forEach(([nome,cbo,setor,qtd,descricao])=>{const c={id:uid(),nome,cbo,setorId:setId[setor]||'',qtd,descricao};e.cargos.push(c);carId[nome]=c.id});
  m.ghes.forEach(([nome,descricao,cargos,riscos])=>{
    const g={id:uid(),nome,descricao,cargoIds:cargos.map(c=>carId[c]).filter(Boolean),riscos:[]};
    riscos.forEach(([ag,o])=>{const r=novoRisco(ag,o);g.riscos.push(r);if(r.recomendacao)e.acoes.push({id:uid(),gheId:g.id,riscoId:r.id,descricao:r.recomendacao,responsavel:'',prazo:'',status:'Pendente'})});
    e.ghes.push(g)});
}

async function buscarCNPJ(){
  const e=emp();e.cnpj=v('e_cnpj');const c=e.cnpj.replace(/\D/g,'');
  if(c.length!==14)return toast('Informe um CNPJ com 14 dígitos');
  toast('Consultando...');
  try{const r=await fetch('https://brasilapi.com.br/api/cnpj/v1/'+c);if(!r.ok)throw 0;const d=await r.json();
    Object.assign(e,{razao:d.razao_social||e.razao,fantasia:d.nome_fantasia||e.fantasia,cnae:String(d.cnae_fiscal||e.cnae),cnaeDesc:d.cnae_fiscal_descricao||e.cnaeDesc,
      endereco:[[d.descricao_tipo_de_logradouro,d.logradouro].filter(Boolean).join(' '),d.numero,d.complemento,d.bairro].filter(Boolean).join(', ')||e.endereco,cidade:d.municipio||e.cidade,uf:d.uf||e.uf,cep:d.cep||e.cep});
    save();render();toast('Dados do CNPJ carregados. Confira o grau de risco no Anexo I da NR-4.');
  }catch(x){toast('Não foi possível consultar o CNPJ agora')}
}

function matrizHTML(riscos){
  let h='<div class="matriz"><div></div>'+[1,2,3,4,5].map(p=>`<div class="lbl" style="text-align:center;padding:0">P${p}</div>`).join('');
  for(let s=5;s>=1;s--){h+=`<div class="lbl">Sev. ${s}</div>`;for(let p=1;p<=5;p++){const n=nivel(p,s),q=riscos.filter(r=>+r.prob===p&&+r.sev===s).length;h+=`<div class="c nv-${n.c}" style="opacity:${q?1:.35}" title="${n.l} (${n.n})">${q||''}</div>`}}
  return h+'</div>';
}
function examesGHE(g){
  const m=new Map([['Exame clínico (anamnese ocupacional e exame físico)',{per:g.riscos.length?'Anual (a critério médico)':'A cada 2 anos',origem:['Todos (NR-7)']}]]);
  g.riscos.forEach(r=>(AG[r.agenteId]?.exames||[]).forEach(([ex,per])=>{if(!m.has(ex))m.set(ex,{per,origem:[]});m.get(ex).origem.push(AG[r.agenteId].nome)}));
  return[...m];
}

function pendencias(e,tipo){
  const c=S.consultoria,p=[];
  if(!e.razao)p.push('Razão social não informada');if(!e.cnpj)p.push('CNPJ não informado');if(!e.grau)p.push('Grau de risco não informado');
  if(!e.ghes.length)p.push('Nenhum GHE cadastrado');
  e.ghes.forEach(g=>{if(!g.cargoIds.length)p.push(`${g.nome}: sem cargos vinculados`);if(!g.riscos.length)p.push(`${g.nome}: sem riscos lançados`)});
  if(tipo==='PGR'&&!c.resp)p.push('Responsável técnico não cadastrado (Minha consultoria)');
  if(tipo==='PCMSO'&&!c.medico)p.push('Médico responsável não cadastrado (Minha consultoria)');
  if(tipo==='LTCAT'){if(!c.eng)p.push('Engenheiro de segurança ou médico do trabalho não cadastrado (Minha consultoria)');
    e.ghes.forEach(g=>g.riscos.forEach(r=>{const x=ltcatAval(r);if(x&&x.res===null)p.push(`${g.nome}: ${r.agente} sem resultado de medição`)}))}
  return p;
}
function tabDocs(e){
  const d=[['PGR','Programa de Gerenciamento de Riscos','NR-1: inventário de riscos, matriz e plano de ação.'],['PCMSO','Programa de Controle Médico de Saúde Ocupacional','NR-7: exames por GHE definidos a partir dos riscos do PGR.'],['LTCAT','Laudo Técnico das Condições Ambientais do Trabalho','Previdência: análise dos agentes nocivos para aposentadoria especial.']];
  return`<div class="docs">${d.map(([k,n,desc])=>{const p=pendencias(e,k);return`<div class="card doccard"><h3>${k}</h3><b style="font-size:13px">${n}</b><p>${desc}</p>
   ${p.length?p.slice(0,6).map(x=>`<div class="alerta">${esc(x)}</div>`).join('')+(p.length>6?`<div class="muted">+${p.length-6} pendência(s)</div>`:''):'<div class="ok">Tudo pronto para gerar</div>'}
   <button class="pri" style="margin-top:10px;width:100%" onclick="gerarDoc('${k}')">Gerar ${k}</button></div>`}).join('')}</div>
   <p class="muted" style="font-size:12px">O documento abre em uma prévia. Use "Imprimir / Salvar PDF" e escolha "Salvar como PDF" como impressora.</p>`;
}
function ltcatAval(r){
  if(!['fisico','quimico','biologico'].includes(r.tipo))return null;
  const a=AG[r.agenteId]||{};
  if(!a.anexoIV)return{res:false,txt:'Agente não relacionado no Anexo IV do Decreto 3.048/99.'};
  if(r.exposicao!=='Habitual e permanente')return{res:false,txt:'Exposição não ocorre de forma habitual e permanente.'};
  if(a.qualitativo){
    if(r.tipo==='biologico')return{res:true,txt:`Avaliação qualitativa. Exposição habitual e permanente a agentes biológicos – código ${a.anexoIV}.`};
    return{res:true,txt:`Agente reconhecidamente cancerígeno (LINACH grupo 1). Avaliação qualitativa; a utilização de EPC/EPI não elimina a nocividade – código ${a.anexoIV}.`};
  }
  const med=parseFloat(r.intensidade),lt=parseFloat(r.limite);
  if(isNaN(med)||isNaN(lt))return{res:null,txt:'Necessária avaliação quantitativa para conclusão.'};
  if(med<=lt)return{res:false,txt:`Resultado (${r.intensidade} ${r.unidade}) dentro do limite de tolerância (${r.limite}).`};
  if(r.agenteId==='ruido')return{res:true,txt:`Resultado (${r.intensidade} ${r.unidade}) acima do limite (${r.limite}). Para ruído, o EPI não descaracteriza a especialidade (STF, ARE 664.335) – código ${a.anexoIV}.`};
  if(r.epiEficaz==='Sim')return{res:false,txt:`Resultado acima do limite, porém neutralizado por EPI eficaz (CA ${r.ca||'—'}).`};
  return{res:true,txt:`Resultado (${r.intensidade} ${r.unidade}) acima do limite (${r.limite}), sem neutralização por EPI eficaz – código ${a.anexoIV}.`};
}
function gerarDoc(tipo){
  const e=emp();const html={PGR:docPGR,PCMSO:docPCMSO,LTCAT:docLTCAT}[tipo](e);
  $('doc').innerHTML=`<div class="doc-bar"><span class="grow">${tipo} — ${esc(e.razao)}</span><button class="pri" onclick="window.print()">🖨 Imprimir / Salvar PDF</button><button onclick="$('doc').classList.remove('show')">Fechar</button></div><div class="paper">${html}</div>`;
  $('doc').classList.add('show');$('doc').scrollTop=0;
  document.title=`${tipo} - ${e.fantasia||e.razao}`;
}

function docPGR(e){
  const c=S.consultoria;const todos=e.ghes.flatMap(g=>g.riscos);
  return capa(e,'PGR','Programa de Gerenciamento de Riscos','NR-1 – Gerenciamento de Riscos Ocupacionais')+secEmpresa(e,1)+secResp(2,c.resp,c.formacao,c.registro)+
  `<h2 class="sec">3. Objetivo e base legal</h2><p>Este Programa de Gerenciamento de Riscos (PGR) materializa o processo de Gerenciamento de Riscos Ocupacionais (GRO) da organização, conforme a Norma Regulamentadora nº 1 (NR-1), com o objetivo de identificar perigos, avaliar os riscos ocupacionais e estabelecer medidas de prevenção para proteger a segurança e a saúde dos trabalhadores. O PGR contempla os agentes físicos, químicos e biológicos, os fatores ergonômicos, os riscos de acidentes e os fatores de riscos psicossociais relacionados ao trabalho, e é composto pelo <b>inventário de riscos</b> e pelo <b>plano de ação</b>.</p>
  <p>Referências: NR-1, NR-6, NR-9, NR-15, NR-17 e demais normas regulamentadoras aplicáveis, Normas de Higiene Ocupacional (NHO) da Fundacentro.</p>
  <h2 class="sec">4. Metodologia de avaliação</h2><p>Os perigos foram identificados por meio de inspeção nos locais de trabalho, entrevistas com trabalhadores e análise das atividades. Cada risco foi avaliado pela combinação da <b>probabilidade</b> de ocorrência do dano e da <b>severidade</b> do dano, considerando as medidas de controle existentes. O nível de risco resulta do produto P × S:</p>
  ${tabelaMatriz()}<table style="width:auto"><tr><th>Nível</th><th>Faixa</th><th>Ação requerida</th></tr><tr><td><span class="badge nv-baixo">Baixo</span></td><td>1 a 4</td><td>Manter as medidas de controle e monitorar.</td></tr><tr><td><span class="badge nv-moderado">Moderado</span></td><td>5 a 9</td><td>Implementar melhorias de forma planejada.</td></tr><tr><td><span class="badge nv-alto">Alto</span></td><td>10 a 14</td><td>Ação prioritária, em curto prazo.</td></tr><tr><td><span class="badge nv-critico">Crítico</span></td><td>15 a 25</td><td>Ação imediata; avaliar interrupção da atividade.</td></tr></table>
  ${secGHE(e,5)}
  <h2 class="sec">6. Inventário de riscos</h2>${e.ghes.map(g=>`<h3>${esc(g.nome)} — ${qtdGHE(e,g)} trabalhador(es)</h3>${g.riscos.length?`<table><tr><th>Tipo</th><th>Agente / perigo</th><th>Fonte / circunstância</th><th>Exposição</th><th>Avaliação</th><th>Possíveis danos</th><th>P</th><th>S</th><th>Nível</th><th>Controles existentes</th></tr>
   ${g.riscos.map(r=>`<tr><td>${TIPOS[r.tipo]?.n}</td><td>${esc(r.agente)}</td><td>${esc(r.fonte)}</td><td>${esc(r.exposicao)}</td><td>${esc(r.avaliacao)}${r.intensidade?`: ${esc(r.intensidade)} ${esc(r.unidade)}${r.limite!==''?` (LT ${esc(r.limite)})`:''}`:''}${r.tecnica?`<br><span class="nota">${esc(r.tecnica)}</span>`:''}</td><td>${esc(r.danos)}</td><td>${r.prob}</td><td>${r.sev}</td><td>${nvBadge(r)}</td><td>${[r.epc&&'EPC/Adm.: '+esc(r.epc),r.epi&&'EPI: '+esc(r.epi)+(r.ca?' (CA '+esc(r.ca)+')':'')].filter(Boolean).join('<br>')||'—'}</td></tr>`).join('')}</table>`:'<p>Não foram identificados riscos para este grupo.</p>'}`).join('')}
  <h3>Resumo por nível de risco</h3><table style="width:auto"><tr>${['Baixo','Moderado','Alto','Crítico'].map(l=>`<th>${l}</th>`).join('')}</tr><tr>${['Baixo','Moderado','Alto','Crítico'].map(l=>`<td style="text-align:center">${todos.filter(r=>nivel(r.prob,r.sev).l===l).length}</td>`).join('')}</tr></table>
  <h2 class="sec">7. Plano de ação</h2><p>As medidas de prevenção obedecem à hierarquia: eliminação do fator de risco, minimização e controle por medidas de proteção coletiva, medidas administrativas ou de organização do trabalho e, por último, equipamentos de proteção individual.</p>
  ${e.acoes.length?`<table><tr><th>GHE</th><th>Risco</th><th>Ação</th><th>Responsável</th><th>Prazo</th><th>Status</th></tr>${e.acoes.map(a=>{const g=e.ghes.find(x=>x.id===a.gheId);const r=g?.riscos.find(x=>x.id===a.riscoId);return`<tr><td>${esc(g?.nome||'')}</td><td>${esc(r?.agente||'Geral')}</td><td>${esc(a.descricao)}</td><td>${esc(a.responsavel)}</td><td>${fmtD(a.prazo)}</td><td>${esc(a.status)}</td></tr>`}).join('')}</table>`:'<p>Não há ações pendentes.</p>'}
  <h2 class="sec">8. Revisão do programa</h2><p>O inventário de riscos deve ser revisto a cada dois anos (ou três anos, para organizações com certificação em sistema de gestão de SST), ou sempre que houver: implementação de medidas de prevenção; inovações e modificações nas tecnologias, ambientes, processos ou organização do trabalho; identificação de inadequações nas medidas de prevenção; ocorrência de acidentes ou doenças relacionadas ao trabalho; ou mudança nos requisitos legais aplicáveis.</p>
  <p><b>Data de elaboração:</b> ${fmtD(e.dataElab)} &nbsp; · &nbsp; <b>Próxima revisão:</b> ${fmtD(e.dataElab?addAnos(e.dataElab,2):'')}</p>
  ${assinatura(c.resp,c.formacao,c.registro)}${assinatura('','Responsável pela empresa',e.razao)}`;
}
function docPCMSO(e){
  const c=S.consultoria;const X='✔';
  return capa(e,'PCMSO','Programa de Controle Médico de Saúde Ocupacional','NR-7')+secEmpresa(e,1)+secResp(2,c.medico,'Médico(a) do Trabalho',c.crm?'CRM '+c.crm:'','Médico responsável pelo PCMSO')+
  `<h2 class="sec">3. Objetivo e base legal</h2><p>O PCMSO tem por objetivo proteger e preservar a saúde dos empregados em relação aos riscos ocupacionais, conforme a avaliação de riscos do Programa de Gerenciamento de Riscos (PGR) da organização, nos termos da Norma Regulamentadora nº 7 (NR-7). O programa tem caráter de prevenção, rastreamento e diagnóstico precoce dos agravos à saúde relacionados ao trabalho.</p>
  <h2 class="sec">4. Exames médicos ocupacionais</h2><p>O PCMSO inclui os exames: <b>admissional</b> (antes do início das atividades); <b>periódico</b>; de <b>retorno ao trabalho</b> (no primeiro dia de retorno, após afastamento igual ou superior a 30 dias por doença ou acidente); de <b>mudança de riscos ocupacionais</b> (antes da mudança); e <b>demissional</b> (em até 10 dias contados do término do contrato, dispensado se o último exame clínico ocupacional tiver sido realizado há menos de 135 dias para empresas de grau de risco 1 e 2, ou 90 dias para grau de risco 3 e 4).</p>
  <p>O exame clínico periódico será realizado anualmente, ou em intervalos menores a critério do médico, para empregados expostos a riscos ocupacionais identificados e classificados no PGR e para portadores de doenças crônicas que aumentem a susceptibilidade; para os demais, a cada dois anos.</p>
  ${secGHE(e,5)}
  <h2 class="sec">6. Riscos e exames por GHE</h2>${e.ghes.map(g=>{const ex=examesGHE(g);return`<h3>${esc(g.nome)}</h3>
   <p><b>Riscos ocupacionais (conforme PGR):</b> ${g.riscos.length?g.riscos.map(r=>`${esc(r.agente)} <i>(${TIPOS[r.tipo]?.n})</i>`).join('; '):'Ausência de riscos ocupacionais específicos.'}</p>
   <table><tr><th>Exame</th><th>Adm.</th><th>Per.</th><th>Ret.</th><th>Mud.</th><th>Dem.</th><th>Periodicidade</th></tr>${ex.map(([n,o],i)=>`<tr><td>${esc(n)}</td><td>${X}</td><td>${X}</td><td>${i===0?X:''}</td><td>${X}</td><td>${X}</td><td>${esc(o.per)}</td></tr>`).join('')}</table>`}).join('')}
  <p class="nota">Adm. = admissional · Per. = periódico · Ret. = retorno ao trabalho · Mud. = mudança de riscos · Dem. = demissional. Exames complementares adicionais poderão ser solicitados a critério do médico responsável.</p>
  <h2 class="sec">7. Atestado de Saúde Ocupacional (ASO)</h2><p>Para cada exame clínico ocupacional será emitido o ASO, contendo: razão social e CNPJ da organização, nome completo e CPF do empregado, cargo, riscos ocupacionais identificados ou a ausência deles, indicação e data dos exames realizados, definição de apto ou inapto para a função, e nome e CRM do médico responsável pelo PCMSO e do médico examinador, com assinatura.</p>
  <h2 class="sec">8. Relatório analítico</h2><p>O médico responsável elaborará relatório analítico anual do PCMSO, contendo o número de exames clínicos e complementares realizados, a estatística de resultados anormais, as incidências de doenças relacionadas ao trabalho e a comparação com o período anterior, para discussão com os responsáveis pelo PGR.</p>
  <h2 class="sec">9. Primeiros socorros</h2><p>A organização deve manter material de primeiros socorros adequado às características da atividade, guardado em local apropriado e sob responsabilidade de pessoa treinada.</p>
  <p><b>Data de elaboração:</b> ${fmtD(e.dataElab)}</p>${assinatura(c.medico,'Médico(a) do Trabalho – responsável pelo PCMSO',c.crm?'CRM '+c.crm:'')}`;
}
function docLTCAT(e){
  const c=S.consultoria;
  const concl=e.ghes.map(g=>{const av=g.riscos.map(r=>[r,ltcatAval(r)]).filter(x=>x[1]);return{g,av,esp:av.some(x=>x[1].res===true),pend:av.some(x=>x[1].res===null)}});
  return capa(e,'LTCAT','Laudo Técnico das Condições Ambientais do Trabalho','Lei 8.213/91 – art. 58 · Decreto 3.048/99')+secEmpresa(e,1)+secResp(2,c.eng,'Engenheiro(a) de Segurança do Trabalho / Médico(a) do Trabalho',c.crea)+
  `<h2 class="sec">3. Objetivo e base legal</h2><p>Este laudo tem por objetivo identificar e avaliar a exposição dos trabalhadores a agentes nocivos químicos, físicos e biológicos, ou associação de agentes, prejudiciais à saúde ou à integridade física, para fins de comprovação perante a Previdência Social, nos termos dos artigos 57 e 58 da Lei nº 8.213/1991, do Anexo IV do Decreto nº 3.048/1999 e das instruções normativas do INSS vigentes. As informações deste laudo subsidiam o Perfil Profissiográfico Previdenciário (PPP) e o evento S-2240 do eSocial.</p>
  <h2 class="sec">4. Metodologia</h2><p>As avaliações quantitativas seguem as metodologias das Normas de Higiene Ocupacional (NHO) da Fundacentro e os limites de tolerância da NR-15. Para agentes reconhecidamente cancerígenos (LINACH grupo 1) e para agentes biológicos, a avaliação é qualitativa. A exposição é considerada para fins de aposentadoria especial quando ocorre de forma <b>habitual e permanente, não ocasional nem intermitente</b>. Riscos ergonômicos, de acidentes e psicossociais não são objeto deste laudo.</p>
  ${secGHE(e,5)}
  <h2 class="sec">6. Avaliação dos agentes nocivos por GHE</h2>${concl.map(({g,av,esp,pend})=>`<h3>${esc(g.nome)}</h3>${av.length?`<table><tr><th>Agente</th><th>Cód. Anexo IV</th><th>Fonte</th><th>Exposição</th><th>Resultado / LT</th><th>Técnica</th><th>EPC / EPI (CA)</th><th>EPI eficaz</th><th>Análise</th></tr>
   ${av.map(([r,x])=>`<tr><td>${esc(r.agente)}</td><td>${esc(AG[r.agenteId]?.anexoIV||'—')}</td><td>${esc(r.fonte)}</td><td>${esc(r.exposicao)}</td><td>${r.intensidade?esc(r.intensidade+' '+r.unidade):'Qualitativa'}${r.limite!==''?' / '+esc(r.limite):''}</td><td>${esc(r.tecnica)}</td><td>${esc([r.epc,r.epi&&(r.epi+(r.ca?' (CA '+r.ca+')':''))].filter(Boolean).join(' / '))||'—'}</td><td>${esc(r.epiEficaz)}</td><td>${esc(x.txt)}</td></tr>`).join('')}</table>`:'<p>Não foram identificados agentes físicos, químicos ou biológicos.</p>'}
   <p><b>Conclusão:</b> ${pend?'⚠ <b>Conclusão pendente</b> – há agente(s) que dependem de avaliação quantitativa.':esp?'As atividades deste GHE <b>ENSEJAM</b> aposentadoria especial (25 anos de exposição), conforme análise acima.':'As atividades deste GHE <b>NÃO ENSEJAM</b> aposentadoria especial.'}</p>`).join('')}
  <h2 class="sec">7. Conclusão geral</h2><table><tr><th>GHE</th><th>Cargos</th><th>Conclusão</th></tr>${concl.map(({g,esp,pend})=>`<tr><td>${esc(g.nome)}</td><td>${esc(e.cargos.filter(x=>g.cargoIds.includes(x.id)).map(x=>x.nome).join(', '))}</td><td>${pend?'Pendente de avaliação':esp?'<b>Enseja aposentadoria especial</b>':'Não enseja aposentadoria especial'}</td></tr>`).join('')}</table>
  <p>Este laudo deve ser atualizado sempre que houver alteração no ambiente de trabalho, no processo produtivo ou na organização do trabalho que possa modificar a exposição aos agentes nocivos.</p>
  <p><b>Data de elaboração:</b> ${fmtD(e.dataElab)}</p>${assinatura(c.eng,'Engenheiro(a) de Segurança do Trabalho / Médico(a) do Trabalho',c.crea)}`;
}

let dlgSave=null;
function openDlg(title,body,onSave){dlg.innerHTML=`<div class="dlg-h">${title}<button onclick="dlg.close()">✕</button></div><div class="dlg-b">${body}</div><div class="dlg-f"><button onclick="dlg.close()">Cancelar</button><button class="pri" onclick="if(dlgSave()!==false)dlg.close()">Salvar</button></div>`;dlgSave=onSave;dlg.showModal()}
function dlgConsultoria(){const c=S.consultoria;
  openDlg('Minha consultoria',`<div class="fg">${inp('c_nome','Nome da consultoria / profissional',c.nome,'span2')}${inp('c_cnpj','CNPJ / CPF',c.cnpj)}${inp('c_cidade','Cidade',c.cidade)}${inp('c_tel','Telefone',c.tel,'span2')}${inp('c_email','E-mail',c.email,'span2')}
   <div class="sep">Responsável técnico pelo PGR</div>${inp('c_resp','Nome',c.resp,'span2')}${inp('c_formacao','Formação',c.formacao)}${inp('c_registro','Registro (ex.: MTE, CREA)',c.registro)}
   <div class="sep">Médico responsável pelo PCMSO</div>${inp('c_medico','Nome',c.medico,'span3')}${inp('c_crm','CRM / UF',c.crm)}
   <div class="sep">Responsável pelo LTCAT (Eng. de Segurança ou Médico do Trabalho)</div>${inp('c_eng','Nome',c.eng,'span3')}${inp('c_crea','CREA / CRM',c.crea)}</div>`,
   ()=>{['nome','cnpj','cidade','tel','email','resp','formacao','registro','medico','crm','eng','crea'].forEach(k=>c[k]=v('c_'+k));save();render();toast('Dados da consultoria salvos')})}
function dlgNovaEmpresa(){
  openDlg('Nova empresa',`<div class="fg">${inp('n_cnpj','CNPJ',' ','span2','placeholder="00.000.000/0000-00"')}${inp('n_razao','Razão social','','span2')}
   ${sel('n_modelo','Começar a partir de',[['','Em branco'],...Object.entries(MODELOS).map(([k,m])=>[k,'Modelo: '+m.nome])],'','span4')}</div>
   <p class="muted" style="font-size:12px">Depois de criar, use "Buscar" na aba Dados para preencher automaticamente pelo CNPJ.</p>`,
   ()=>{const e=novaEmpresa(v('n_razao').trim(),v('n_cnpj').trim());if(v('n_modelo'))aplicarModelo(e,v('n_modelo'));S.empresas.push(e);save();go(e.id,v('n_modelo')?'ghe':'dados');toast('Empresa criada')});
  $('n_cnpj').value='';
}
function carregarExemplo(){const e=novaEmpresa('Auto Center Exemplo Ltda','00.000.000/0001-00');Object.assign(e,{fantasia:'Auto Center Exemplo',cnae:'4520-0/01',cnaeDesc:'Serviços de manutenção e reparação mecânica de veículos automotores',endereco:'Rua Exemplo, 100, Centro',cidade:'São Paulo',uf:'SP',cep:'01000-000'});aplicarModelo(e,'oficina');
  if(!S.consultoria.nome)Object.assign(S.consultoria,{nome:'Minha Consultoria SST',resp:'Nome do Técnico',registro:'MTE 00000',medico:'Dr(a). Nome do Médico',crm:'00000/SP',eng:'Eng. Nome do Engenheiro',crea:'CREA 0000000000',cidade:'São Paulo'});
  S.empresas.push(e);save();go(e.id,'ghe');toast('Empresa de exemplo carregada')}
function exportar(){const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`risco360-backup-${hojeISO()}.json`;a.click();URL.revokeObjectURL(a.href)}
function importar(inpEl){const f=inpEl.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.empresas)throw 0;if(!confirm('Substituir todos os dados atuais pelo backup?'))return;S=d;save();go(null);toast('Backup restaurado')}catch(x){toast('Arquivo de backup inválido')}};r.readAsText(f);inpEl.value=''}

render();
</script>
